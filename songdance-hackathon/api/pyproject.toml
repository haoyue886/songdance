[project]
name = "songdance-api"
version = "0.3.0"
description = "API and worker for SongDance piano transcription"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.18.5",
  "basic-pitch==0.4.0",
  "boto3==1.43.57",
  "fastapi==0.140.7",
  "librosa==0.11.0",
  "music21==10.5.0",
  "onnxruntime==1.28.0",
  "pretty-midi==0.2.11",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "redis==7.4.1",
  "rq==2.10.0",
  "scikit-learn==1.5.1",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.41.0",
  "yt-dlp==2026.7.4",
  "yt-dlp-ejs==0.8.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
