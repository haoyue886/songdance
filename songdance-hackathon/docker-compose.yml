services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      SONGDANCE_ENVIRONMENT: development
      SONGDANCE_CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      SONGDANCE_DATABASE_URL: postgresql+psycopg://songdance:local-only@postgres:5432/songdance
      SONGDANCE_REDIS_URL: redis://redis:6379/0
      SONGDANCE_STORAGE_BACKEND: s3
      SONGDANCE_S3_ENDPOINT_URL: http://minio:9000
      SONGDANCE_S3_BUCKET: songdance
      SONGDANCE_S3_ACCESS_KEY: songdance
      SONGDANCE_S3_SECRET_KEY: local-development-only
      SONGDANCE_YOUTUBE_ENABLED: ${SONGDANCE_YOUTUBE_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: ./api
    command: python -m app.worker
    environment:
      SONGDANCE_ENVIRONMENT: development
      SONGDANCE_CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      SONGDANCE_DATABASE_URL: postgresql+psycopg://songdance:local-only@postgres:5432/songdance
      SONGDANCE_REDIS_URL: redis://redis:6379/0
      SONGDANCE_STORAGE_BACKEND: s3
      SONGDANCE_S3_ENDPOINT_URL: http://minio:9000
      SONGDANCE_S3_BUCKET: songdance
      SONGDANCE_S3_ACCESS_KEY: songdance
      SONGDANCE_S3_SECRET_KEY: local-development-only
      SONGDANCE_YOUTUBE_ENABLED: ${SONGDANCE_YOUTUBE_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  cleanup:
    build: ./api
    command: python -m app.jobs.cleanup --loop
    environment:
      SONGDANCE_ENVIRONMENT: development
      SONGDANCE_CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      SONGDANCE_DATABASE_URL: postgresql+psycopg://songdance:local-only@postgres:5432/songdance
      SONGDANCE_REDIS_URL: redis://redis:6379/0
      SONGDANCE_STORAGE_BACKEND: s3
      SONGDANCE_S3_ENDPOINT_URL: http://minio:9000
      SONGDANCE_S3_BUCKET: songdance
      SONGDANCE_S3_ACCESS_KEY: songdance
      SONGDANCE_S3_SECRET_KEY: local-development-only
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: songdance
      POSTGRES_USER: songdance
      POSTGRES_PASSWORD: local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songdance -d songdance"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: songdance
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
